[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sylp"
version = "0.1.0"
description = "A standalone local-first coding harness with persistent model-driven tasks"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Sean Benhur", email = "seanbenhur@gmail.com"}]
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
antigravity = ["google-antigravity>=0.1.0"]

[project.scripts]
sylp = "sylp_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sylp_harness*"]
